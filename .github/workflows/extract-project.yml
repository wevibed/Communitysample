name: Extract Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-project:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP_FILE="wevibed-community-demo.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found in repository root."
            exit 1
          fi

          mkdir -p extracted-project
          unzip -o "$ZIP_FILE" -d extracted-project

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add extracted-project

          if git diff --cached --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Extract project ZIP"
            git push
          fi
